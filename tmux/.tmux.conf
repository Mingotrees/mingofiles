# ==========================================
# PANE RESIZING & TEXT WRAPPING
# ==========================================

# Force tmux to resize windows based on the smallest/largest *active* client
# instead of clamping to the size of the smallest entire session view.
setw -g aggressive-resize on

# Ensure terminal overrides support modern text reflow/wrapping features
set -as terminal-overrides ",xterm*:XT:Ms=\\E]52;%p1%s;%p2%s\\7"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Cc"


set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use Vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy to the Wayland clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Config reloaded!"


# styling


# Palette: charcoal surfaces with soft gray borders and white text.
set -g pane-border-style 'fg=#555555'
set -g pane-active-border-style 'fg=#aaaaaa'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#dce1e5 bg=#1b1e22'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=#dce1e5 bg=#252a30'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 100

setw -g window-status-current-style 'fg=#1b1e22 bg=#8bcac8'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#aaaaaa bg=#1b1e22'
setw -g window-status-format ' #I #[fg=#dce1e5]#W #[fg=#aaaaaa]#F '

setw -g window-status-bell-style 'fg=#1b1e22 bg=#d49898 bold'

# messages
set -g message-style 'fg=#1b1e22 bg=#8bcac8 bold'
